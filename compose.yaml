services:
  govee-rgbic-bridge:
    image: romeolazar/govee-rgbic-bridge:latest
    build: .
    container_name: govee-rgbic-bridge
    network_mode: host
    restart: unless-stopped
    env_file:
      - .env
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 5s
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
